<ion-col col-6 offset-3>
  <ion-grid>
    <ion-row>
      <ion-col>
        <div class="switch-wrapper">
          <ion-label float-left>{{device.display_name || device.name}}</ion-label>
        </div>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-grid class="button-group">
          <ion-row>
            <ion-col>
              <ion-button ion-button block outline
                (click)="onChangeEndpoint(lowEndpoint)"
                [color]="lowEndpoint.current === 'On' ? 'secondary': 'light'">
                Low
              </ion-button>
            </ion-col>
            <ion-col>
              <ion-button ion-button block outline
                (click)="onChangeEndpoint(mediumEndpoint)"
                [color]="mediumEndpoint.current === 'On' ? 'secondary': 'light'">
                Medium
              </ion-button>
            </ion-col>
            <ion-col>
              <ion-button ion-button block outline
                (click)="onChangeEndpoint(highEndpoint)"
                [color]="highEndpoint.current === 'On' ? 'secondary': 'light'">
                High
              </ion-button>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-col>
<ion-col col-12>
  <node-actuator-auto
    [updatedName]="updatedName"
    [updatedNotification]="updatedNotification"
    (setEndpointName)="updateName($event)"
    (setEndpointNotification)="updateNotification($event)"
    (setAction)="updateEndpoint($event)"
    [endpoints]="endpointsUnassigneds"
    [device]="device">
  </node-actuator-auto>
</ion-col>
