<ion-grid *ngIf="data.current !== undefined" class="temperature-actuator">
  <ion-row>
    <ion-col style="margin-top: -25px;">
      <div class="switch-wrapper">
        <ion-range
          (ionChange)="onChangeDimmer($event)" 
          [min]="2*min" 
          [max]="2*max"
          [(ngModel)]="rangeValue" 
          step="1" 
          aria-label="Custom range" 
        >
        </ion-range>
        <div class="outer-container">
          <div
            class="tempGraph-container"
            id="tempGraph-container-{{endpoint._id}}"
          >
            <div class="tempGraph" id="tempGraph-{{endpoint._id}}" #tempGraph>
              <input
                class="temp-input"
                type="range"
                [value]="data.current"
                disabled
              />
              <label style="margin-top: -10px;" *ngIf="data.current > actualTemperature.current" for="temp"
                >heating</label
              >
              <label *ngIf="data.current < actualTemperature.current" for="temp"
                >cooling</label
              >
              <output for="temp"><p>{{data.current}}</p></output>
            </div>
          </div>
        </div>
      </div>
    </ion-col>
  </ion-row>
</ion-grid>
