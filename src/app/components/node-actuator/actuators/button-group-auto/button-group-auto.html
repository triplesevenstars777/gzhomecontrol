<ion-grid *ngIf="data.current !== undefined">
    <ion-row>
        <ion-col>
            <div class="switch-wrapper">
                <ion-button
                  (click)="updateName()"
                  color="primary"
                  size="small"
                  >
                    <ion-icon name="create"></ion-icon>
                </ion-button>
                <ion-label float-left>{{data.display_name || data.name}}</ion-label>
            </div>
        </ion-col>
    </ion-row>
    <ion-row>
        <ion-col>
            <ion-grid class="button-group">
                <ion-row>
                    <ion-col *ngFor="let state of data.states">
                        <ion-button expand="block" fill="outline"
                            (click)="onChangeEndpoint(state.name)"
                            [color]="data.current === state.name ? 'secondary': 'light'">
                            {{state.name}}
                        </ion-button>
                    </ion-col>
                </ion-row>
            </ion-grid>
        </ion-col>
    </ion-row>
    <!-- <ion-row>
      <ion-col>
        <ion-item class="notifications-adjust">
            <ion-toggle class="notifications-switch" (ionChange)="updateNotification()" [(ngModel)]="notifications" value="1"></ion-toggle>
            <ion-label class="notifications-text" id="enabled" *ngIf="notifications" color="primary">{{'NOTIFICATIONS_ENABLED' |translate}}</ion-label>
            <ion-label class="notifications-text" id="disabled" *ngIf="!notifications">{{'NOTIFICATIONS_DISABLED' |translate}}</ion-label>
        </ion-item>
      </ion-col>
    </ion-row> -->
</ion-grid>
