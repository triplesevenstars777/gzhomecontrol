  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->
<ion-header>
  <ion-navbar>
    <ion-row>
        <ion-col col-11>
            <ion-title class="title-scene">{{ 'SCENES' | translate }}</ion-title>
        </ion-col>
        <ion-col col-1>
            <ion-icon name="add-circle" class="add-scene" (click)="addScene()"></ion-icon>
          </ion-col>
       </ion-row> 
  </ion-navbar>
</ion-header>
<ion-content padding>
      <ion-list *ngFor="let scene of scenes">
        <ion-item-sliding> 
            <ion-item color="light" (click)="editScene(scene._id)">
            <ion-label >{{scene?.name}}</ion-label>
            <ion-toggle color="dark" item-end [(ngModel)]="scene.active" (ionChange)="changeActive(scene._id, scene.active)"></ion-toggle>
            </ion-item>
            <ion-item-options side="left">
            <button ion-button color="danger" (click)="deleteScene(scene._id)">
              <ion-icon name="trash"></ion-icon>
                {{ 'DELETE' | translate }}
            </button>
          </ion-item-options>
        </ion-item-sliding>
      </ion-list>
  </ion-content>
