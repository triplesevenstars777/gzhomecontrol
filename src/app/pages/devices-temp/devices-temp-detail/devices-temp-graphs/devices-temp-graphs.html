<ion-header>
    <ion-navbar>
        <ion-title>{{ endpoint?.display_name || endpoint.name }}</ion-title>
    </ion-navbar>
</ion-header>
<ion-content>
    <div class="graph-container">
        <label>
            <ul>
                <li class="dropdown-intro">{{'SHOW' |translate}}</li>
                <li>
                    <div class="form-group pull-right endpoints-dropdown">
                        <select class="form-control" [ngModel]="limit" (ngModelChange)="onChangeLimit($event)">
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="150">150</option>
                            <option value="200">200</option>
                        </select>
                    </div>
                </li>
                <li class="dropdown-intro">{{'ENTRIES' |translate}}</li>
            </ul>
        </label>
        <div class="col-md-12">
            <canvas id="canvas"></canvas>
        </div>
    </div>
</ion-content>
<main-footer [menuVisible]="false"></main-footer>
