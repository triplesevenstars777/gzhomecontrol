<main-header [icon]="'temp'" [section]="'Temp'|translate " [homeVisible]="true">
</main-header>
<ion-content class="scroll-content">
  <ion-grid>
    <ion-row style="padding-left: 20px; padding-top: 130px;">
      <ion-col
        size-lg="2"
        size-md="3"
        size-sm="4"
        *ngFor="let item of currentDevices"
      >
        <div class="sensor__card card content-item">
          <div class="click-handler" (click)="item.active && openItem(item)">
            <div class="relay-status" [class.has-relay]="item.active">
              <div
                class="relay-0"
                [class.is-active]="item.relay0 === 'On'"
                *ngIf="item.relay0"
              ></div>
              <div
                class="relay-1"
                [class.is-active]="item.relay1 === 'On'"
                *ngIf="item.relay1"
              ></div>
            </div>
            <div class="item-icon center">
              <span
                [class.active]="item.active"
                class="icon icon-gz-temp temp"
                [class.is-heating]="item.targetTemp > item.currentTemp"
              ></span>
              <strong class="temp-value" *ngIf="item.active"
                >{{item.currentTemp ? item.currentTemp+' ºC':'&nbsp;'}}</strong
              ><br />
              <strong class="temp-target" *ngIf="item.active"
                >{{item.targetTemp ? '(' + item.targetTemp+' ºC)':'&nbsp;'}}</strong
              >
              <strong *ngIf="!item.active">OFF</strong>
            </div>
            <div class="item-text center item-bold">
              {{item.display_name || item.name }}
            </div>
            <div class="item-text center small">
              <small>{{item.room?.name}}</small>
            </div>
          </div>
          <div class="actions" *ngIf="isWallTablet || item.hasRule">
            <span
              class="icon-gz-edit"
              (click)="updateNodeName($event, item)"
              
            ></span>
            <span
              class="icon-gz-cog"
              (click)="openModal(item)"
              *ngIf="item.hasRule"
            ></span>
          </div>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
<main-footer [menuVisible]="true"></main-footer>
